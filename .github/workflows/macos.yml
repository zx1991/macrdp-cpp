name: macOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate hardware diagnostic tools
        run: |
          bash -n tools/collect_hardware_diagnostics.sh
          bash -n tools/run_hardware_lifecycle.sh
          xcrun swiftc -typecheck tools/macrdp_system_probe.swift

      - name: Install dependencies
        run: brew install ffmpeg openssl@3

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix ffmpeg);$(brew --prefix openssl@3)"

      - name: Build
        run: cmake --build build --parallel 3

      - name: Collect build diagnostics
        run: |
          tools/collect_hardware_diagnostics.sh \
            --server build/macrdp-server \
            --skip-preflight \
            --output "$RUNNER_TEMP/macrdp-hardware-diagnostics"
          pushd "$RUNNER_TEMP/macrdp-hardware-diagnostics"
          shasum -a 256 -c manifest.sha256
          popd

      - name: Test
        run: ctest --test-dir build --output-on-failure
